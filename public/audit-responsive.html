<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Space Buro — проверка адаптивности</title><style>*{box-sizing:border-box}body{margin:0;background:#ddd;font:14px system-ui}header{position:sticky;top:0;z-index:2;background:#fff;padding:10px;display:flex;gap:10px;flex-wrap:wrap}button,select{min-height:44px;padding:8px}main{overflow:auto}iframe{display:block;border:0;margin:auto;height:800px;background:white}pre{white-space:pre-wrap;max-height:170px;overflow:auto;padding:12px;margin:0;background:#eee;font-size:11px}</style><header><span>Проверка CSS-ширины. Не эмуляция устройства.</span><button data-w="375">375 px</button><button data-w="768">768 px</button><button data-w="1280">1280 px</button><button data-w="1920">1920 px</button><label>Страница <select id="route"><option value="/">Главная RU</option><option value="/en/">Главная EN</option><option value="/calculator/">Калькулятор RU</option><option value="/en/calculator/">Калькулятор EN</option><option value="/projects/al-furjan-villa/">Al Furjan</option><option value="/projects/elemental-day-surgery-clinic/">Elemental Clinic</option><option value="/china-furniture/">Мебель из Китая</option></select></label><button id="inspect">Проверить размеры</button></header><pre id="report" aria-live="polite"></pre><main><iframe id="site" title="Проверяемый сайт" style="width:375px" src="/"></iframe></main><script>
const frame=document.querySelector('#site');const report=document.querySelector('#report');function inspect(){const d=frame.contentDocument,w=frame.contentWindow;const controls=[...d.querySelectorAll('button,input,select,textarea,.lab-header-actions a')].filter(e=>{const r=e.getBoundingClientRect();return r.width&&r.height&&getComputedStyle(e).visibility!=='hidden'&&!e.closest('[inert]')});report.textContent=JSON.stringify({url:w.location.pathname,width:w.innerWidth,scrollWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>w.innerWidth+1,h1:[...d.querySelectorAll('h1')].map(x=>x.textContent),smallControls:controls.map(e=>({name:e.getAttribute('aria-label')||e.textContent?.trim().slice(0,60)||e.name,tag:e.tagName,w:Math.round(e.getBoundingClientRect().width),h:Math.round(e.getBoundingClientRect().height)})).filter(x=>x.w<44||x.h<44).slice(0,25),brokenLoadedImages:[...d.images].filter(i=>i.complete&&!i.naturalWidth).map(i=>i.getAttribute('src')),viewport:d.querySelector('meta[name=viewport]')?.content},null,2)}document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{frame.style.width=b.dataset.w+'px';requestAnimationFrame(()=>requestAnimationFrame(inspect))});document.querySelector('#route').onchange=e=>frame.src=e.target.value;document.querySelector('#inspect').onclick=inspect;frame.onload=inspect;
</script></html>
